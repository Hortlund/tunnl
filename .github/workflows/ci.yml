name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.2'
          cache: true
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build ./cmd/tunnl ./cmd/tunnld
      - name: Fuzz protocol decoders
        run: |
          set -euo pipefail
          for target in FuzzDecodeHello FuzzDecodeWelcome FuzzDecodeControl FuzzReadHello FuzzReadWelcome FuzzReadControl FuzzReadValue; do
            go test ./internal/protocol -fuzz="^${target}$" -fuzztime=10s
          done

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.2'
          cache: true
      # Install from source with the workflow's Go toolchain. The published
      # golangci-lint and govulncheck binaries are built with an older Go
      # and cannot load a module that targets Go 1.27.
      - name: golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
          golangci-lint run --timeout=5m ./...
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck ./...

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: tunnl-server:test
          load: true
          build-args: |
            VERSION=ci-test
            COMMIT=ci-test-commit
            BUILD_DATE=2026-01-01T00:00:00Z
      - name: Verify embedded server version
        run: docker run --rm tunnl-server:test --version | grep -F 'tunnld ci-test (ci-test-commit, 2026-01-01T00:00:00Z)'
