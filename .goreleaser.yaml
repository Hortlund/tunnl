version: 2

builds:
  - id: tunnl-client
    main: ./cmd/tunnl
    binary: tunnl
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - >-
        -s -w
        -X github.com/Hortlund/tunnl/internal/version.Version={{.Tag}}
        -X github.com/Hortlund/tunnl/internal/version.Commit={{.Commit}}
        -X github.com/Hortlund/tunnl/internal/version.Date={{.Date}}

archives:
  - id: tunnl-client
    ids: [tunnl-client]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'

release:
  mode: keep-existing
  replace_existing_artifacts: true
