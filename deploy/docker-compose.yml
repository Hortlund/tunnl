services:
  tunnld:
    image: ghcr.io/hortlund/tunnl-server:latest
    restart: unless-stopped
    environment:
      TUNNL_AUTH_TOKENS: "${TUNNL_AUTH_TOKENS:?set TUNNL_AUTH_TOKENS}"
      TUNNL_BASE_DOMAIN: "${TUNNL_BASE_DOMAIN:-tunnl.at}"
      TUNNL_DATABASE: /data/tunnl.db
      TUNNL_PUBLIC_PORT: "443"
      TUNNL_ACME: "${TUNNL_ACME:-true}"
      TUNNL_ACME_EMAIL: "${TUNNL_ACME_EMAIL:-}"
      TUNNL_ACME_STORAGE: /data/acme
      TUNNL_ACME_STAGING: "${TUNNL_ACME_STAGING:-false}"
      TUNNL_TLS_CERT: "${TUNNL_TLS_CERT:-}"
      TUNNL_TLS_KEY: "${TUNNL_TLS_KEY:-}"
      TUNNL_ADMIN_ADDR: "${TUNNL_ADMIN_ADDR:-}"
      TUNNL_ADMIN_TOKEN: "${TUNNL_ADMIN_TOKEN:-}"
      TUNNL_ADMIN_ALLOW_REMOTE: "${TUNNL_ADMIN_ALLOW_REMOTE:-false}"
      TUNNL_CLOUDFLARE_API_TOKEN: "${TUNNL_CLOUDFLARE_API_TOKEN:-}"
    ports:
      - "80:8080/tcp"
      - "443:8443/tcp"
      - "443:8443/udp"
      - "127.0.0.1:${TUNNL_ADMIN_PORT:-9090}:9090/tcp"
    volumes:
      - tunnl-data:/data
      - ./certs:/certs:ro
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

volumes:
  tunnl-data:
